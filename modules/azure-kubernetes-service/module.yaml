name: azure-kubernetes-service
sources:
  - https://github.com/Unique-AG/terraform-modules/tree/main/modules/azure-kubernetes-service
version: 8.0.0
compatibility:
  unique.ai: ~> 2025.20
changes:
  - kind: changed
    description: "BREAKING: `kata_node_pool_settings` now provisions `azurerm_kubernetes_cluster_node_pool` with native `workload_runtime = \"KataVmIsolation\"` instead of the `azapi_resource` workaround, now that the azurerm provider supports it directly. Any existing kata node pool will be destroyed and recreated on upgrade, since the resource address and type changed. Requires `azurerm ~> 4.78`; the `azapi` provider is no longer a dependency of this module."
