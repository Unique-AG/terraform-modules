name: azure-kubernetes-service
sources:
  - https://github.com/Unique-AG/terraform-modules/tree/main/modules/azure-kubernetes-service
version: 8.0.0
compatibility:
  unique.ai: ~> 2025.20
changes:
  - kind: changed
    description: |-
      BREAKING: `kata_node_pool_settings` now provisions `azurerm_kubernetes_cluster_node_pool` with native `workload_runtime = "KataVmIsolation"` instead of the `azapi_resource` workaround, now that the azurerm provider supports it directly. Requires `azurerm ~> 4.78`; the `azapi` provider is no longer a dependency of this module.

      The module detaches the old `azapi_resource.kata_node_pool` from state via a `removed` block (no-op if you never had one). If you have an existing kata node pool, add a temporary root-module `import` block before upgrading, or Terraform will try to create a duplicate agent pool and the apply will fail:
      ```hcl
      import {
        to = module.aks.azurerm_kubernetes_cluster_node_pool.kata_node_pool["<key>"]
        id = "${module.aks.kubernetes_cluster_id}/agentPools/<key>"
      }
      ```
      Replace `<key>` with the key(s) used in your `kata_node_pool_settings` map. Remove the `import` block(s) in a follow-up commit once the apply succeeds.
