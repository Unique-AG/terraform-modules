name: "Release ZITADEL Bootstrap"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - modules/zitadel-bootstrap/module.yaml
  pull_request:
    branches:
      - main
    paths:
      - modules/zitadel-bootstrap/**

jobs:
  validate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/immutable-artifact.yaml
    with:
      module: zitadel-bootstrap
  release:
    if: ${{ github.event.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release.yaml
    with:
      module: zitadel-bootstrap
